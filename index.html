<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0">
    <meta name="author" content="Lucas">
    <title>Formulário</title>
</head>
<body>
    
<form >
<fieldset>

    <label for="request">REQUERENTE</label>
        <input type="text" name="requerimento" id="request">
    <label for="matricula">N DE MATRICULA</label>
        <input type="number" name="Matricula" id="matricula">
      
<hr>
PREENCHER |
    <label for="birthdate">DATA NASCIMENTO</label>  
        <input type="date" name="Nascimento" id="nascimento">
    <label for="naturalidade">NATURALIDADE</label>
        <select name="Naturalidade" id="naturalidade">
            <option value="Brasileiro">Brasileiro</option>
            <option value="Estrangeiro">Estrangeiro</option>
        </select>
    <label for="filiacao">FILIAÇÃO</label>
        <input type="text" name="Filiacao" id="filiacao">

<hr>

    <label for="curso">Curso</label>
        <select name="Curso" id="curso">
            <option value="engeletrica">Engenharia Elétrica</option>
            <option value="engmecanica">Engenharia Mecânica</option>
            <option value="sistemas">Sistemas de Informação</option>
            <option value="mecatronica">Mecatrônica Industrial</option>
            <option value="fisica">Física</option>
            <option value="matematica">Matemática</option>
        </select>
    <label for="periodo">PERÍODO</label>
            <select name="Periodo" id="periodo">
            <option value="semestre1">1º Semestre</option>
            <option value="semestre2">2º Semestre</option>
        </select>
    <label for="turno">Turno</label>
        <select name="Turno" id="turno">
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
        </select>
<br>
    <label for="telefone">TELEFONE</label>
    <input type="number" name="Telefone" id="telefone">
    <label for="email">EMAIL</label>
    <input type="email" name="Email" id="email">
</fieldset>


<fieldset>
<ol>
   <li><input type="checkbox" id="2via" name="2via" value="2via">
        <label for="2via">2º Via(especificar)</label></li>
    <li><input type="checkbox" id="aproveitamento" name="aproveitamento" value="aproveitamento">
        <label for="aproveitamento">aproveitamento de Disciplina (anexar Histórico Escolar e Programa de Disciplina)</label></li> 
    <li><input type="checkbox" id="matriculaprazo" name="matriculaprazo" value="matriculaprazo">
        <label for="matriculaprazo">Matrícula fora do prazo (justificar)</label></li> 
    <li><input type="checkbox" id="cancelamento" name="cancelamento" value="cancelamento">
        <label for="cancelamento">Cancelamento de Matrícula</label></li> 
    <li><input type="checkbox" id="colacao" name="colacao" value="colacao">
        <label for="colacao">Colação de Grau / Colação de Grau Especial (justificar)</label></li> 
    <li><input type="checkbox" id="especificar" name="especificar" value="especificar">
        <label for="especificar">Declaração (especificar])</label></li> 
    <li><input type="checkbox" id="diploma" name="diploma" value="diploma">
        <label for="diploma">Diploma (especificar])</label></li> 
    <li><input type="checkbox" id="historico" name="historico" value="historico">
        <label for="historico">Histórico Escolar</label></li> 
    <li><input type="checkbox" id="reabertura" name="reabertura" value="reabertura">
        <label for="reabertura">Reabertura de Matrícula</label></li> 
    <li><input type="checkbox" id="segchamada" name="segchamada" value="segchamada">
        <label for="reabertura">Segunda Chamada (anexar justificativa e especificar)</label></li>
    <li><input type="checkbox" id="reingresso" name="reingresso" value="reingresso">
        <label for="reingresso">Reingresso</label></li>
    <li><input type="checkbox" id="trancamento" name="trancamento" value="trancamento">
        <label for="reingresso">Trancamento de Disciplina (especificar)</label></li> 
    <li><input type="checkbox" id="trancamentomatricula" name="trancamentomatricula" value="trancamentomatricula">
        <label for="trancamentomatricula">Trancamento de Matrícula (anexar documentação comprobatória)</label></li> 
    <li><input type="checkbox" id="transferencia" name="transferencia" value="transferencia">
        <label for="transferencia">Transferência para outra Instituição</label></li> 
    <li><input type="checkbox" id="validacao" name="validacao" value="validacao">
        <label for="validacao">Validação de Conhecimento (especificar)</label></li> 
    <li><input type="checkbox" id="reajuste" name="reajuste" value="reajuste">
        <label for="reajuste">Reajuste</label></li> 
    <li><input type="checkbox" id="recorrecao" name="recorrecao" value="recorrecao">
        <label for="recorrecao">Recorreção de Prova</label></li> 
    <li><input type="checkbox" id="atransporte" name="atransporte" value="atransporte">
        <label for="atransporte">AUXÍLIO - Transporte</label></li>
    <li><input type="checkbox" id="amoradia" name="amoradia" value="amoradia">
        <label for="amoradia">AUXÍLIO - Moradia</label></li> 
    <li><input type="checkbox" id="aoculos" name="aoculos" value="aoculos">
        <label for="aoculos">AUXÍLIO - Óculos</label></li>
    <li><input type="checkbox" id="apais" name="apais" value="apais">
        <label for="apais">AUXÍLIO - Pais e Mães</label></li>
    <li><input type="checkbox" id="outros" name="outros" value="outros">
        <label for="outros">Outros (especificar)</label></li>
   
</ol>

</fieldset>
<label for="justificar">Justificar</label>
<input type="text" name="justificar" id="justificar">

<br>
<label for="especificar">Especificar</label>
    <input type="text" name="especificar" id="especificar">
<br>
<input type="radio" name="declaro" id="declaro">
    <label for="declaro">DECLARO CONHECER O REGIMENTO DESTA IFE,BEM COMO O PRAZO
    NECESSÁRIO À TRAMITAÇÃO DO PROCESSO</label><br>
    
        <input type="text" name="assinaturaum" id="assinaturaum">
        <input type="text" name="assinaturadois" id="assinaturadois"><br>
            <label for="assinaturadois">FUNCIONÁRIO (ASS. LEGÍVEL)</label>
            <label for="assinaturaum">REQUERENTE (ASS. LEGÍVEL)</label>


</form>

</body>
</html>
