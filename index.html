<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0">
    <meta name="author" content="Lucas">
    <title>Formulário</title>
</head>
<body>
    
<form >
<fieldset>

    <label for="request">REQUERENTE</label>
        <input type="text" name="requerimento" id="request">
    <label for="matricula">N DE MATRICULA</label>
        <input type="number" name="Matricula" id="matricula">
      
<hr>
PREENCHER |
    <label for="birthdate">DATA NASCIMENTO</label>  
        <input type="date" name="Nascimento" id="nascimento">
    <label for="naturalidade">NATURALIDADE</label>
        <select name="Naturalidade" id="naturalidade">
            <option value="Brasileiro">Brasileiro</option>
            <option value="Estrangeiro">Estrangeiro</option>
        </select>
    <label for="filiacao">FILIAÇÃO</label>
        <input type="text" name="Filiacao" id="filiacao">

<hr>

    <label for="curso">Curso</label>
        <select name="Curso" id="curso">
            <option value="engeletrica">Engenharia Elétrica</option>
            <option value="engmecanica">Engenharia Mecânica</option>
            <option value="sistemas">Sistemas de Informação</option>
            <option value="mecatronica">Mecatrônica Industrial</option>
            <option value="fisica">Física</option>
            <option value="matematica">Matemática</option>
        </select>
    <label for="periodo">PERÍODO</label>
            <select name="Periodo" id="periodo">
            <option value="semestre1">1º Semestre</option>
            <option value="semestre2">2º Semestre</option>
        </select>
    <label for="turno">Turno</label>
        <select name="Turno" id="turno">
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
        </select>
<br>
    <label for="telefone">TELEFONE</label>
    <input type="number" name="Telefone" id="telefone">
    <label for="email">EMAIL</label>
    <input type="email" name="Email" id="email">
</fieldset>
</form>




</body>
</html>
